<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Splitter & Bill Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased pb-12" x-data="billSplitter()">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-6 shadow-md mb-8">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i data-lucide="receipt" class="w-8 h-8"></i>
        <h1 class="text-2xl font-bold tracking-tight">Check Splitter</h1>
      </div>
      <button @click="resetAll()" class="text-xs bg-indigo-500 hover:bg-indigo-700 text-white py-1.5 px-3 rounded-lg transition flex items-center gap-1 font-medium">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Check
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">

    <!-- Left Column: Inputs & Setup -->
    <div class="md:col-span-2 space-y-6">

      <!-- Step 1: People -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
        <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i>
          1. Who's Splitting?
        </h2>

        <!-- Custom Name Input + Quick-Select Toggle Button -->
        <div class="space-y-3">
          <form @submit.prevent="addCustomPerson()" class="flex gap-2">
            <input 
              type="text" 
              x-model="newPersonName" 
              placeholder="Enter name..." 
              class="flex-1 px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm"
            >
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition flex items-center gap-1">
              <i data-lucide="plus" class="w-4 h-4"></i> Add
            </button>
          </form>

          <div>
            <button 
              type="button" 
              @click="showRepo = !showRepo" 
              class="w-full text-xs font-semibold px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl border border-slate-200 transition flex items-center justify-between"
            >
              <span class="flex items-center gap-1.5">
                <i data-lucide="user-check" class="w-4 h-4 text-indigo-600"></i>
                Select from Saved Friends List
              </span>
              <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" :class="{ 'rotate-180': showRepo }"></i>
            </button>

            <!-- Collapsible Friends Repo List -->
            <div x-show="showRepo" x-cloak x-transition class="mt-2 p-3 bg-slate-50 border border-slate-200 rounded-xl max-h-48 overflow-y-auto">
              <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] font-medium text-slate-500">Tap a name to add/remove:</span>
                <span class="text-[11px] text-indigo-600 font-semibold" x-text="people.length + ' selected'"></span>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <template x-for="name in savedRepo" :key="name">
                  <button 
                    type="button"
                    @click="togglePerson(name)"
                    class="text-xs px-2.5 py-1 rounded-lg border transition font-medium flex items-center gap-1"
                    :class="people.includes(name) ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'"
                  >
                    <span x-text="name"></span>
                    <i x-show="people.includes(name)" data-lucide="check" class="w-3 h-3"></i>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- Currently Selected Active People -->
        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-semibold text-slate-600 mb-2">Active Diners on this Check:</label>
          <div class="flex flex-wrap gap-2">
            <template x-for="person in people" :key="person">
              <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-700 font-medium text-sm rounded-full border border-indigo-100">
                <span x-text="person"></span>
                <button @click="removePerson(person)" class="text-indigo-400 hover:text-indigo-600 rounded-full p-0.5">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </span>
            </template>
            <template x-if="people.length === 0">
              <p class="text-xs text-slate-400 italic">No diners selected yet. Type a name or tap options from the saved list.</p>
            </template>
          </div>
        </div>
      </section>

      <!-- Step 2: Items -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-indigo-600"></i>
          2. Add Items
        </h2>

        <form @submit.prevent="addItem()" class="space-y-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="grid grid-cols-3 gap-2">
            <input 
              type="text" 
              x-model="newItemName" 
              placeholder="Item name (e.g. Pasta)" 
              class="col-span-2 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
            >
            <div class="relative">
              <span class="absolute left-3 top-2 text-slate-400 text-sm">$</span>
              <input 
                type="number" 
                step="0.01" 
                min="0" 
                x-model="newItemPrice" 
                placeholder="0.00" 
                class="w-full pl-7 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
              >
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1.5">Who shared this item? (Default: Everyone)</label>
            <div class="flex flex-wrap gap-2">
              <template x-for="person in people" :key="person">
                <label class="inline-flex items-center gap-1.5 px-3 py-1 border rounded-lg text-xs cursor-pointer select-none transition"
                  :class="newItemAssignees.includes(person) ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'">
                  <input type="checkbox" :value="person" x-model="newItemAssignees" class="hidden">
                  <span x-text="person"></span>
                </label>
              </template>
              <template x-if="people.length === 0">
                <p class="text-xs text-slate-400">Please add people first to assign items.</p>
              </template>
            </div>
          </div>

          <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2 rounded-lg transition flex items-center justify-center gap-1">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Item
          </button>
        </form>

        <!-- Item List -->
        <div class="space-y-2">
          <template x-for="(item, index) in items" :key="index">
            <div class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl">
              <div>
                <p class="font-medium text-sm text-slate-800" x-text="item.name"></p>
                <p class="text-xs text-slate-500">Shared by: <span class="font-medium text-indigo-600" x-text="item.assignees.join(', ')"></span></p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-semibold text-sm text-slate-900" x-text="'$' + Number(item.price).toFixed(2)"></span>
                <button @click="removeItem(index)" class="text-slate-400 hover:text-red-500 transition">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </template>
          <template x-if="items.length === 0">
            <p class="text-xs text-slate-400 italic text-center py-4">No items added to check yet.</p>
          </template>
        </div>
      </section>

      <!-- Step 3: Tax & Tip -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="calculator" class="w-5 h-5 text-indigo-600"></i>
          3. Tax & Tip
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Tax Input -->
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Tax Total ($)</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400 text-sm">$</span>
              <input 
                type="number" 
                step="0.01" 
                min="0" 
                x-model.number="tax" 
                placeholder="0.00" 
                class="w-full pl-7 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
              >
            </div>
          </div>

          <!-- Tip Input -->
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Tip Paid ($)</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400 text-sm">$</span>
              <input 
                type="number" 
                step="0.01" 
                min="0" 
                x-model.number="tip" 
                placeholder="0.00" 
                class="w-full pl-7 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
              >
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- Right Column: Results Summary -->
    <div class="space-y-6">

      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-600"></i>
          Split Summary
        </h2>

        <!-- Check Overview -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 mb-6 text-sm">
          <div class="flex justify-between text-slate-600">
            <span>Subtotal:</span>
            <span class="font-medium" x-text="'$' + subtotal.toFixed(2)"></span>
          </div>
          <div class="flex justify-between text-slate-600">
            <span>Tax:</span>
            <span class="font-medium" x-text="'$' + taxTotal.toFixed(2)"></span>
          </div>
          <div class="flex justify-between text-slate-600">
            <span>Tip:</span>
            <span class="font-medium" x-text="'$' + tipTotal.toFixed(2)"></span>
          </div>
          <div class="border-t border-slate-200 pt-2 flex justify-between font-bold text-slate-900 text-base">
            <span>Grand Total:</span>
            <span x-text="'$' + grandTotal.toFixed(2)"></span>
          </div>
        </div>

        <!-- Individual Breakdown -->
        <div class="space-y-3">
          <template x-for="(summary, person) in individualTotals" :key="person">
            <div class="p-3 border border-slate-200 rounded-xl space-y-2 bg-slate-50/50">
              <div class="flex justify-between items-center">
                <span class="font-semibold text-slate-900" x-text="person"></span>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-indigo-600 text-base" x-text="'$' + summary.total.toFixed(2)"></span>
                  <button 
                    @click="copyIndividualText(person, summary)" 
                    class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded transition"
                    title="Copy Kakao / Venmo Text"
                  >
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
              <div class="text-xs text-slate-500 flex justify-between">
                <span>Items: $<span x-text="summary.subtotal.toFixed(2)"></span></span>
                <span>Tax: $<span x-text="summary.tax.toFixed(2)"></span></span>
                <span>Tip: $<span x-text="summary.tip.toFixed(2)"></span></span>
              </div>
            </div>
          </template>

          <template x-if="people.length === 0">
            <p class="text-xs text-slate-400 italic text-center py-4">Add people and items to view calculated totals.</p>
          </template>
        </div>

      </section>

    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function billSplitter() {
      return {
        showRepo: false,
        savedRepo: [
          'Tim1', 'Jon', 'Janet', 'Becky', 'Chans', 'Yoonmi', 
          'JY', 'John', 'Bianca', 'Eric', 'Susan', 'Choun', 
          'Suzie', 'David', 'Flopy', 'Tim2', 'Yeji', 'Wilson', 
          'Jessica', 'Kaitlyn', 'Lakisha', 'Aja', 'Jaymie', 'Lizmar'
        ],
        people: JSON.parse(localStorage.getItem('cs_people')) || [],
        newPersonName: '',
        items: JSON.parse(localStorage.getItem('cs_items')) || [],
        newItemName: '',
        newItemPrice: '',
        newItemAssignees: [],
        tax: parseFloat(localStorage.getItem('cs_tax')) || 0,
        tip: parseFloat(localStorage.getItem('cs_tip')) || 0,

        init() {
          this.$watch('people', val => localStorage.setItem('cs_people', JSON.stringify(val)));
          this.$watch('items', val => localStorage.setItem('cs_items', JSON.stringify(val)));
          this.$watch('tax', val => localStorage.setItem('cs_tax', val));
          this.$watch('tip', val => localStorage.setItem('cs_tip', val));
        },

        addCustomPerson() {
          const name = this.newPersonName.trim();
          if (name && !this.people.includes(name)) {
            this.people.push(name);
            this.newPersonName = '';
            this.refreshIcons();
          }
        },

        togglePerson(name) {
          if (this.people.includes(name)) {
            this.removePerson(name);
          } else {
            this.people.push(name);
            this.refreshIcons();
          }
        },

        removePerson(name) {
          this.people = this.people.filter(p => p !== name);
          this.items.forEach(item => {
            item.assignees = item.assignees.filter(p => p !== name);
          });
          this.refreshIcons();
        },

        addItem() {
          const price = parseFloat(this.newItemPrice);
          if (this.newItemName.trim() && !isNaN(price) && price > 0) {
            this.items.push({
              name: this.newItemName.trim(),
              price: price,
              assignees: this.newItemAssignees.length > 0 ? [...this.newItemAssignees] : [...this.people]
            });
            this.newItemName = '';
            this.newItemPrice = '';
            this.newItemAssignees = [];
            this.refreshIcons();
          }
        },

        removeItem(index) {
          this.items.splice(index, 1);
          this.refreshIcons();
        },

        resetAll() {
          this.people = [];
          this.items = [];
          this.tax = 0;
          this.tip = 0;
          localStorage.clear();
          this.refreshIcons();
        },

        copyIndividualText(person, summary) {
          const text = `Hey ${person}! Your check total is $${summary.total.toFixed(2)} (Subtotal: $${summary.subtotal.toFixed(2)}, Tax: $${summary.tax.toFixed(2)}, Tip: $${summary.tip.toFixed(2)})`;
          navigator.clipboard.writeText(text);
          alert(`Copied text for ${person} to clipboard! Ready to paste into KakaoTalk or Venmo.`);
        },

        get subtotal() {
          return this.items.reduce((sum, item) => sum + Number(item.price || 0), 0);
        },

        get taxTotal() {
          return Number(this.tax || 0);
        },

        get tipTotal() {
          return Number(this.tip || 0);
        },

        get grandTotal() {
          return this.subtotal + this.taxTotal + this.tipTotal;
        },

        get individualTotals() {
          const summary = {};

          this.people.forEach(p => {
            summary[p] = { subtotal: 0, tax: 0, tip: 0, total: 0 };
          });

          if (this.people.length === 0) return summary;

          this.items.forEach(item => {
            const assignees = item.assignees.length > 0 ? item.assignees : this.people;
            const splitPrice = item.price / assignees.length;

            assignees.forEach(p => {
              if (summary[p]) {
                summary[p].subtotal += splitPrice;
              }
            });
          });

          const currentSubtotal = this.subtotal;

          this.people.forEach(p => {
            const ratio = currentSubtotal > 0 ? (summary[p].subtotal / currentSubtotal) : (1 / this.people.length);
            summary[p].tax = this.taxTotal * ratio;
            summary[p].tip = this.tipTotal * ratio;
            summary[p].total = summary[p].subtotal + summary[p].tax + summary[p].tip;
          });

          return summary;
        },

        refreshIcons() {
          this.$nextTick(() => {
            lucide.createIcons();
          });
        }
      };
    }
  </script>
</body>
</html>
